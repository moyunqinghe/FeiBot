[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-protocols"
version = "1.0.0"
description = "Pure protocol layer for LLM providers (OpenAI chat.completions / responses, Anthropic messages, Gemini generateContent), model config snapshots and crypto helpers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx",
    "openai",
    "anthropic",
    "cryptography",
    "pydantic",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["llm_protocols*"]
